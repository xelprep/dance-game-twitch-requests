# Builds standalone binaries for all six platform targets and publishes them as
# a GitHub Release.
#
# How to cut a release:
#   1. Open Actions -> "Release" -> "Run workflow", pick a branch and a version
#      bump (patch / minor / major), and run it.
#   2. The "bump" job bumps package.json, commits, tags v<version>, and pushes.
#   3. That tag push triggers this same workflow again, which runs the six
#      build jobs and the release job.
#
# Alternatively, bump the version by hand, commit, and push a v* tag yourself —
# the build + release jobs run on any v* tag push.
#
# Every target is built on a *matched* runner (same OS + arch as the target),
# so no cross-compilation or emulation is involved. See pkg.config.js for the
# packaging configuration (Enhanced SEA mode, native module assets, etc.).

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for the new release"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Bumps the version in package.json (+ lockfile), commits, tags, and pushes.
  # The tag push re-triggers this workflow, which then runs build + release.
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_RELEASE_PAT }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Bump version, commit, and tag
        run: |
          npm version "${{ github.event.inputs.bump }}" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" "v${VERSION}"

  # One job per target, each on a runner matching the target's OS and arch.
  build:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: node24-macos-arm64
            runner: macos-26
            os: macos
            arch: arm64
            ext: ""
          - target: node24-macos-x64
            runner: macos-26-intel
            os: macos
            arch: x64
            ext: ""
          - target: node24-win-x64
            runner: windows-latest
            os: windows
            arch: x64
            ext: ".exe"
          - target: node24-win-arm64
            runner: windows-11-arm
            os: windows
            arch: arm64
            ext: ".exe"
          - target: node24-linux-x64
            runner: ubuntu-26.04
            os: linux
            arch: x64
            ext: ""
          - target: node24-linux-arm64
            runner: ubuntu-26.04-arm
            os: linux
            arch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Matched runner: the host platform equals the target platform, so the
      # default optional-dependency selection (sharp's @img/* packages) is
      # exactly what pkg.config.js asks for.
      - name: Install dependencies
        run: npm ci
      # pkg.config.js sets sea: true (stock Node.js, full ESM support).
      - name: Package with pkg
        run: npx pkg . --targets "${{ matrix.target }}"
      - name: Rename and zip
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $base = "dance-game-twitch-requests-${version}-${{ matrix.os }}-${{ matrix.arch }}"
          $os = "${{ matrix.os }}"
          if ($os -eq "macos") {
            # Ship the .app bundle (postBuild wrapped the binary and removed the bare one).
            Compress-Archive -Path "dist/Dance Game Twitch Requests.app" -DestinationPath "dist/$base.zip" -Force
          } elseif ($os -eq "windows") {
            Compress-Archive -Path "dist/dance-game-twitch-requests.exe" -DestinationPath "dist/$base.zip" -Force
          } else {
            # Linux: the binary plus the freedesktop launcher files postBuild wrote.
            Compress-Archive -Path "dist/dance-game-twitch-requests","dist/dance-game-twitch-requests.desktop","dist/icon.png","dist/install.sh" -DestinationPath "dist/$base.zip" -Force
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.zip

  # Creates the GitHub Release for the pushed tag and attaches all six zips.
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*/*.zip
          body: |
            ## First launch

            **macOS** — Unzip, then right-click the app → **Open** once (or run
            `xattr -d com.apple.quarantine "Dance Game Twitch Requests.app"`). After that,
            double-click it: a Terminal window opens with live logs, and the setup wizard
            appears on first run. Closing the Terminal window stops the app.

            **Windows** — Double-click the `.exe`. A console window shows live logs; the
            setup wizard appears on first run.

            **Linux** — Unzip, then run `./install.sh` once. The app appears in your
            application menu; on GNOME, right-click it → **Allow Launching** the first time.
            Double-clicking opens a terminal window running the app; closing it stops the app.

            On every platform the control panel opens in your browser once the servers start
            (disable with `AUTO_OPEN_BROWSER=false`). Only one instance runs at a time; a
            second launch exits with a message instead of failing on a port conflict.
