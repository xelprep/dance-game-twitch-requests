<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moderator Request Control</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Moderator Request Control</h1>
          <p id="stats">Loading…</p>
        </div>
        <div class="actions">
          <button id="logout" type="button" hidden>Log out</button>
          <button id="next">Play Next</button>
          <button id="clear">Clear Queue</button>
        </div>
      </header>

      <section class="now panel">
        <div class="section-head">
          <h2>Now Playing</h2>
        </div>
        <div id="now">Nothing playing.</div>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>Request Queue</h2>
          <button id="refresh">Refresh</button>
        </div>
        <div id="queue"></div>
      </section>

      <section class="panel">
        <div class="section-head"><h2>Song Search</h2></div>
        <label for="search">Search by title or browse songs</label>
        <div class="search-row">
          <input id="search" autocomplete="off" placeholder="Title" />
        </div>
        <div class="filters">
          <label
            >Pack
            <select id="filter-pack">
              <option value="">All packs</option>
            </select>
          </label>
          <label
            >Genre
            <select id="filter-genre">
              <option value="">All genres</option>
            </select>
          </label>
          <label
            >Style
            <select id="filter-style">
              <option value="">Any</option>
              <option value="dance-single">Single</option>
              <option value="dance-double">Doubles</option>
            </select>
          </label>
          <label
            >Difficulty
            <select id="filter-difficulty">
              <option value="">All difficulties</option>
            </select>
          </label>
          <label
            >Meter
            <select id="filter-meter-min">
              <option value="">Min</option>
            </select>
            <select id="filter-meter-max">
              <option value="">Max</option>
            </select>
          </label>
          <label
            >Sort
            <select id="sort-field">
              <option value="title">Title</option>
              <option value="artist">Artist</option>
              <option value="pack">Pack</option>
              <option value="last_modified">Last modified</option>
            </select>
          </label>
          <label
            >Order
            <select id="sort-order">
              <option value="asc">Asc</option>
              <option value="desc">Desc</option>
            </select>
          </label>
          <label
            >Per page
            <select id="per-page">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
          <div class="pager">
            <button id="search-prev" type="button" disabled>Prev</button>
            <span>Page</span>
            <input
              id="page-input"
              class="page-input"
              type="number"
              min="1"
              value="1"
              aria-label="Current page number"
            />
            <span id="pageInfo">of 1</span>
            <button id="search-next" type="button" disabled>Next</button>
          </div>
        </div>
        <div class="search-reset-row">
          <button id="reset-search" type="button">Reset Search</button>
        </div>
        <div id="results" class="results"></div>
        <div class="pager">
          <button id="search-prev-bottom" type="button" disabled>Prev</button>
          <span>Page</span>
          <input
            id="page-input-bottom"
            class="page-input"
            type="number"
            min="1"
            value="1"
            aria-label="Current page number"
          />
          <span id="pageInfo-bottom">of 1</span>
          <button id="search-next-bottom" type="button" disabled>Next</button>
        </div>
      </section>

      <div id="toast" class="copy-status" role="status"></div>
    </main>
    <script src="/requestModerator.js"></script>
  </body>
</html>
